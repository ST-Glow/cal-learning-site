name: Deploy CAL site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html styles.css app.js config.js learning-model.js \
            ticket-game.js teacher-dashboard.js performance-dashboard.js \
            live2d-assistant.js usage-tour.js _site/
          cp -R assets _site/assets
          find . -maxdepth 1 -type f -name '*.pdf' -exec cp {} _site/ \;
          touch _site/.nojekyll
          echo "Published size:"
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
